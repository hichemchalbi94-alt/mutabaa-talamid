<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>أداة استرجاع كلمة السر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{font-family:'Tajawal',sans-serif;background:#F5F2EA;color:#12312B;margin:0;padding:20px;}
  .box{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  h1{font-size:17px;margin:0 0 6px;}
  p{font-size:13px;color:#3C5750;line-height:1.7;}
  textarea{width:100%;min-height:140px;padding:12px;border-radius:10px;border:1px solid #E4DFD1;font-family:'Tajawal',sans-serif;font-size:14px;box-sizing:border-box;margin-top:10px;}
  button{background:#12312B;color:#F5F2EA;border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer;margin-top:12px;width:100%;}
  button:disabled{opacity:.5;}
  .log{margin-top:16px;font-size:13px;background:#F5F2EA;border-radius:10px;padding:12px;white-space:pre-wrap;max-height:300px;overflow-y:auto;}
  .ok{color:#215E45;font-weight:900;background:#CFE3D6;padding:10px;border-radius:10px;margin-top:12px;}
  .warn{color:#C1483A;font-size:12px;margin-top:10px;}
</style>
</head>
<body>
<div class="box">
  <h1>🔎 أداة استرجاع كلمة السر</h1>
  <p>اكتب كل احتمال لكلمة السر في سطر منفصل (جرب: بحرف كبير وصغير في البداية، بمسافة وبلا مسافة، بأرقام عربية وإنجليزية...). الأداة تجرب كل واحدة تلقائيًا وتقولك أي وحدة فيهم تفتح بياناتك الحقيقية. <b>هذي الأداة قراءة فقط — ما تلمس ولا تعدّل أي بيانات.</b></p>
  <textarea id="candidates" placeholder="كلمة سر 1
كلمة سر 2
كلمة سر 3"></textarea>
  <button id="tryBtn">جرّب كل الاحتمالات</button>
  <div id="result"></div>
  <div class="log" id="log" style="display:none;"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAiHW0sifV19scx2tnyLViWHqfq2l94gXI",
  authDomain: "mutabaa-talamid.firebaseapp.com",
  projectId: "mutabaa-talamid",
  storageBucket: "mutabaa-talamid.firebasestorage.app",
  messagingSenderId: "286556328339",
  appId: "1:286556328339:web:01ea1523acb5fa93cf9866"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

async function deriveKey(password, iterations){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: enc.encode('mutabaa-talamid-salt-v1'), iterations, hash:'SHA-256' },
    keyMaterial, { name:'AES-GCM', length:256 }, false, ['decrypt']
  );
}
async function deriveDocId(password){
  const enc = new TextEncoder();
  const digest = await crypto.subtle.digest('SHA-256', enc.encode('mutabaa-doc-id-v1:' + password));
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function decryptState(payload, key){
  const iv = new Uint8Array(payload.iv);
  const data = new Uint8Array(payload.data);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return JSON.parse(new TextDecoder().decode(plain));
}

function log(msg){
  const el = document.getElementById('log');
  el.style.display = 'block';
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

document.getElementById('tryBtn').addEventListener('click', async () => {
  const raw = document.getElementById('candidates').value;
  const candidates = raw.split('\n').map(s => s.trim()).filter(Boolean);
  if(candidates.length === 0){ alert('اكتب كلمة سر واحدة على الأقل'); return; }

  document.getElementById('tryBtn').disabled = true;
  document.getElementById('log').textContent = '';
  document.getElementById('result').innerHTML = '';

  // أولًا: اجمع كل المستندات الموجودة فعليًا (بلا معرفة أسمائها مسبقًا) عبر التحقق المباشر لكل كلمة سر مرشّحة
  for(const pw of candidates){
    log('جاري تجربة: "' + pw + '"...');
    try{
      const docId = await deriveDocId(pw);
      const snap = await db.collection('mutabaa-app').doc(docId).get();
      if(!snap.exists){
        log('  → لا يوجد حساب بهذا الاحتمال (مسار فارغ)');
        continue;
      }
      const payload = snap.data().payload;
      let state = null, iterUsed = null;
      for(const iter of [210000, 150000]){
        try{
          const key = await deriveKey(pw, iter);
          state = await decryptState(payload, key);
          iterUsed = iter;
          break;
        }catch(e){ /* جرب العدد التالي */ }
      }
      if(state){
        const count = (state.students||[]).length;
        log('  ✅ نجحت! عدد التلاميذ الموجودين: ' + count);
        document.getElementById('result').innerHTML = `<div class="ok">🎉 كلمة السر الصحيحة هي: "${pw}"<br>عدد التلاميذ: ${count}</div>`;
        document.getElementById('tryBtn').disabled = false;
        return;
      } else {
        log('  → المسار موجود لكن كلمة السر غلط لفكّ تشفيره');
      }
    }catch(e){
      log('  → خطأ: ' + e.message);
    }
  }
  document.getElementById('result').innerHTML = '<div class="warn">ما لقيناش كلمة سر تفتح بيانات حقيقية من بين الاحتمالات المكتوبة. جرب تزيد احتمالات أخرى (فرق حرف كبير/صغير، مسافات، أرقام).</div>';
  document.getElementById('tryBtn').disabled = false;
});
</script>
</body>
</html>
